<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXT LEVEL · Catálogo Pro $130</title><style>:root{--bg:#f4f0e8;--fg:#111;--muted:#68645e;--card:#fff;--line:#d8d2c8;--hot:#ff4d00;--acid:#d7ff00}body.dark{--bg:#101010;--fg:#f7f7f7;--muted:#aaa;--card:#191919;--line:#303030}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,sans-serif}.nav{height:72px;padding:0 5vw;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--fg);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 90%,transparent);z-index:5}.logo{font-size:22px;font-weight:1000}.hot{color:var(--hot)}.nav a{color:var(--fg);text-decoration:none;margin:0 12px;font-size:12px;font-weight:800}.theme,.cat{border:2px solid var(--fg);background:transparent;color:var(--fg);border-radius:99px;padding:9px 13px;font-weight:900}.hero{padding:75px 5vw 45px}.tag{background:var(--hot);color:#111;padding:8px 11px;font-size:11px;font-weight:900}.hero h1{font-size:clamp(55px,10vw,125px);line-height:.8;letter-spacing:-.09em;margin:25px 0}.hero p{max-width:650px;color:var(--muted);line-height:1.6}.tools{padding:0 5vw 28px;display:flex;gap:10px;flex-wrap:wrap}.search{border:2px solid var(--fg);background:var(--card);color:var(--fg);padding:12px 17px;border-radius:99px;min-width:260px}.cat{cursor:pointer}.cat.active,.cat:hover{background:var(--fg);color:var(--bg)}#cats{display:flex;gap:8px;flex-wrap:wrap}.grid{padding:0 5vw 80px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.product{background:var(--card);border:2px solid var(--fg);transition:.2s}.product:hover{transform:translateY(-6px);box-shadow:7px 7px 0 var(--hot)}.visual{height:205px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acid) 0 50%,#eee 50%)}.shape{width:43%;aspect-ratio:1;background:var(--hot);border-radius:50% 15%;transform:rotate(20deg);box-shadow:9px 9px 0 #111}.product:nth-child(3n) .shape{background:#111;border-radius:10%}.info{padding:14px;border-top:2px solid var(--fg)}.info b{display:block}.price{display:block;font-size:20px;font-weight:1000;margin-top:6px}.info small{display:block;color:var(--muted);margin-top:5px}.badge{float:right;border:1px solid var(--fg);border-radius:99px;padding:4px 6px;font-size:8px;font-weight:900}.social{position:fixed;right:16px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:10}.social a{width:45px;height:45px;border:2px solid #111;border-radius:50%;display:grid;place-items:center;background:var(--hot);color:#111;text-decoration:none;font-weight:1000;box-shadow:4px 4px 0 #111}.foot{padding:22px 5vw;border-top:2px solid var(--fg);font-weight:800}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.nav a{display:none}}@media(max-width:480px){.grid{grid-template-columns:1fr}.search{width:100%;min-width:0}}</style></head><body><nav class="nav"><b class="logo">NEXT LEVEL<span class="hot">.</span></b><div><a href="/">INICIO</a><a href="/catalogo/">CATÁLOGO</a><a href="/tienda/">TIENDA</a><button class="theme" onclick="document.body.classList.toggle('dark')">◐</button></div></nav><header class="hero"><span class="tag">CATÁLOGO PRO · $130</span><h1>50 PRODUCTOS.<br><span class="hot">MÁS CONTROL.</span></h1><p>Una experiencia más completa: búsqueda, categorías, estados de disponibilidad y fichas de producto. Pensada para negocios con más movimiento.</p></header><div class="tools"><input class="search" id="q" placeholder="Buscar producto..."><div id="cats"></div></div><main class="grid" id="grid"></main><div class="social"><a href="#">◎</a><a href="#">♪</a><a href="#">◔</a><a href="#">f</a></div><footer class="foot">NEXT LEVEL. · CATÁLOGO PRO $130 · 50 PRODUCTOS · BÚSQUEDA + FILTROS</footer><script>const categories=['Todos','Calzado','Ropa','Accesorios','Hogar','Tecnología','Belleza','Deportes'];const products=['Runner One','Luna Leather','Axis 02','Urban Shell','Nova Bag','Core Hoodie','Studio Tee','Daily Cap','Cloud Sneaker','Terra Bottle','Mono Backpack','Pulse Watch','Aura Lamp','Frame Desk','Soft Chair','Flow Speaker','Air Buds','Peak Jacket','Move Short','Classic Denim','Essential Tee','City Pack','Trail Cap','Stone Wallet','Minimal Belt','Echo Glasses','Muse Perfume','Pure Cream','Glow Serum','Fresh Mist','Flex Mat','Power Band','Run Bottle','Lift Gloves','Court Bag','Home Candle','Calm Diffuser','Linen Set','Oak Tray','Soft Throw','Smart Hub','Pixel Stand','Charge Dock','Wave Headset','Mini Camera','Travel Case','Weekend Pack','Signature Shoes','Limited Jacket','NOVA Gift'];let active='Todos';const grid=document.querySelector('#grid'),cats=document.querySelector('#cats');categories.forEach((x,i)=>{let b=document.createElement('button');b.className='cat '+(!i?'active':'');b.textContent=x;b.onclick=()=>{active=x;document.querySelectorAll('.cat').forEach(y=>y.classList.remove('active'));b.classList.add('active');render()};cats.append(b)});document.querySelector('#q').oninput=render;function render(){let q=document.querySelector('#q').value.toLowerCase();grid.innerHTML='';products.forEach((p,i)=>{let c=categories[i%8+1];if(active!='Todos'&&c!=active||q&&!p.toLowerCase().includes(q))return;let a=document.createElement('article');a.className='product';a.innerHTML=`<div class="visual"><div class="shape"></div></div><div class="info"><span class="badge">${i%4?'DISPONIBLE':'NUEVO'}</span><b>${p}</b><span class="price">$${69+i*4}</span><small>${c}</small></div>`;a.onclick=()=>alert('Ficha de producto: '+p);grid.append(a)})}render();</script></body></html>
